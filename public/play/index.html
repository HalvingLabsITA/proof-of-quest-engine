<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proof of Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: cabinato arcade. Schermo di gioco a sinistra, "etichetta della cartuccia" (il blocco in gioco) a destra; su telefono si impila.
   Palette: 4 tonalità dell'era di halving corrente, sostituite live dal JS quando attraversi un halving. Look unico, scuro. */
:root{
  --c0:#140b04; --c1:#5c2a07; --c2:#f7931a; --c3:#ffe7c2;
  --bg:color-mix(in srgb, var(--c0) 70%, #000);
  --line:var(--c1);
  --font-display:"Press Start 2P","Courier New",monospace;
  --font-body:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--c3);font-family:var(--font-body);font-size:20px;line-height:1.2;transition:background-color .6s}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{font-family:var(--font-display);font-size:clamp(13px,2.2vw,18px);letter-spacing:.08em;color:var(--c2);margin:0;text-wrap:balance}
.brand span{display:block;font-family:var(--font-body);font-size:19px;letter-spacing:0;color:var(--c3);opacity:.8;margin-top:6px}
.pill{font-family:var(--font-display);font-size:9px;letter-spacing:.08em;display:inline-flex;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);color:var(--c3)}
.dot{width:8px;height:8px;background:var(--c1);flex:none}
.dot.on{background:var(--c2);animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.cab{background:var(--c0);border:3px solid var(--c1);padding:10px;display:grid;gap:10px;min-width:0}
.screen{position:relative;container-type:inline-size;aspect-ratio:4/3;width:100%;max-width:100%;background:var(--c0);overflow:hidden;outline:2px solid #000}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
/* livello delle sfere a piena risoluzione: ogni pixel della sfera ha la stessa misura, bordi netti a qualsiasi ingrandimento */
#ocv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 7cqw rgba(0,0,0,.6)}
/* Finestre stile JRPG */
.win{position:absolute;background:var(--c0);color:var(--c3);border:.55cqw solid var(--c3);outline:.5cqw solid var(--c0);border-radius:.9cqw;padding:1.4cqw 2.2cqw;font-family:var(--font-body);font-size:4.4cqw;line-height:1.08}
/* HUD sulla mappa: numero del blocco in piccolo in alto, vita e sats nelle due sfere in basso (le sfere sono disegnate nel canvas, i numeri qui) */
#hud{top:1.4cqw;left:1.8cqw;padding:0;background:none;border:0;outline:0;box-shadow:none;font-family:var(--font-display);font-size:2.3cqw;line-height:1;color:var(--c3);opacity:.9;text-shadow:.3cqw 0 0 var(--c0),-.3cqw 0 0 var(--c0),0 .3cqw 0 var(--c0),0 -.3cqw 0 var(--c0)}
#orbs{position:absolute;inset:0;pointer-events:none}
#orbs span{position:absolute;font-family:var(--font-display);text-align:center;line-height:1;white-space:nowrap}
/* posizione e dimensione delle sfere in pixel nativi (--r raggio, --lx/--rx centri, --cy altezza), 1 pixel nativo = 0,390625cqw */
#orbs{--r:12;--lx:16;--rx:239;--cy:175;--u:.390625cqw}
#orbs .n{width:calc(var(--r) * 2 * var(--u));top:calc((var(--cy) - var(--r) * .42) * var(--u))}
#orbs .l{width:calc(var(--r) * 2 * var(--u));font-size:calc(var(--r) * .104cqw);top:calc((var(--cy) + var(--r) * .27) * var(--u))}
#oHp,#oHpL{left:calc((var(--lx) - var(--r)) * var(--u));color:#fff4e0}
#oSats,#oSatsL{left:calc((var(--rx) - var(--r)) * var(--u));color:#3a2a0a}
#oHp.low{animation:blink 1s steps(2,start) infinite}
#oLv{left:calc((var(--lx) - var(--r)) * var(--u));top:calc((var(--cy) - var(--r) - 13) * var(--u));font-size:1.9cqw;color:var(--c0);background:var(--c2);border:.4cqw solid var(--c0);outline:.3cqw solid var(--c2);border-radius:.6cqw;padding:.5cqw .9cqw .4cqw}
#dlg{left:2.2cqw;right:2.2cqw;bottom:2.2cqw;min-height:19cqw;cursor:pointer}
#dlgMore{position:absolute;right:2.4cqw;bottom:1.2cqw;font-family:var(--font-display);font-size:2.2cqw;animation:blink .8s steps(2,start) infinite}
#menu{right:2.2cqw;bottom:2.2cqw;width:74cqw}
#ebar{top:calc(var(--ay,0px) + 2.2cqw);left:2.2cqw;width:48cqw;font-family:var(--font-display);font-size:2.2cqw;padding:1.2cqw 2cqw;white-space:nowrap}
#hbar{right:2.2cqw;top:calc(var(--ay,0px) + 36cqw);width:46cqw;font-size:3.9cqw;padding:1.2cqw 2cqw;white-space:nowrap}
#hbar .nm{font-family:var(--font-display);font-size:2.2cqw;display:flex;justify-content:space-between}
#ebar .nm{overflow:hidden;text-overflow:ellipsis}
#ebar .intent{font-family:var(--font-body);font-size:3.8cqw;color:var(--c2);margin-top:.6cqw}
#ebar .bar,#hbar .bar{width:100%}
#hbar .rk{font-family:var(--font-display);font-size:1.7cqw;color:var(--c2);margin-top:.5cqw}
#hbar .low{color:var(--c2);animation:blink 1s steps(2,start) infinite}
#log{left:13cqw;right:13cqw;bottom:1.6cqw;font-size:3.6cqw;padding:1cqw 2cqw;pointer-events:none}
.bar{height:1.2cqw;background:var(--c1);margin-top:.8cqw;width:34cqw}
.bar i{display:block;height:100%;background:var(--c2);transition:width .3s}
#center{inset:4cqw 5cqw;display:flex;flex-direction:column;gap:1.6cqw;overflow:hidden}
#cbody{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1.6cqw;scrollbar-width:thin;scrollbar-color:var(--c1) transparent}
#cmenu{flex:none}
#center.clear{overflow:auto}
#cside{display:none}
#center.title{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:1.4cqw 3cqw;align-items:start;justify-items:stretch;text-align:left}
#center.title #cbody{grid-column:1/-1;align-items:center;text-align:center}
#center.title #cmenu{grid-column:1}
#center.title #cside{display:block;grid-column:2;border:.4cqw solid var(--c1);padding:1.2cqw 1.6cqw;background:color-mix(in srgb,var(--c0) 82%,transparent)}
#cside .support{display:block;margin-top:1.2cqw;padding-top:1cqw;border-top:.3cqw dashed var(--c1);color:var(--c2);text-decoration:none;font-size:2.8cqw;letter-spacing:.04em}
#cside .support:hover,#cside .support:focus-visible{color:var(--c3);text-decoration:underline}
body.touch #cside .support{font-size:3.6cqw;padding:1.6cqw 0 .6cqw}
#center.title .menu{width:100%}
body:not(.touch) #center.title .logo{font-size:5cqw}
body:not(.touch) #center.title .menu button{font-size:3.6cqw;padding-top:.15cqw;padding-bottom:.15cqw}
body:not(.touch) #center.title .menu button small{font-size:2.9cqw}
.top5 h4{font-family:var(--font-display);font-weight:400;font-size:1.9cqw;letter-spacing:.08em;color:var(--c2);margin:0 0 1cqw}
.top5 ol{list-style:none;margin:0;padding:0;display:grid;gap:.2cqw;font-size:3.6cqw;font-variant-numeric:tabular-nums}
.top5 li{display:grid;grid-template-columns:3.4cqw minmax(0,1fr) auto;gap:1.2cqw;align-items:baseline}
.top5 li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5 .me,.board .me{color:var(--c2)}
.top5 p{margin:0;font-size:3.2cqw;opacity:.8}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:3.8cqw}
.board th{font-family:var(--font-display);font-weight:400;font-size:1.7cqw;letter-spacing:.06em;color:var(--c2);text-align:left;padding:.6cqw .8cqw;border-bottom:.3cqw solid var(--c1)}
.board td{padding:.3cqw .8cqw;border-bottom:.2cqw dashed var(--c1)}
.board td.n,.board th.n{text-align:right}
#pqName{font:inherit;font-size:5cqw;width:100%;background:var(--c0);color:var(--c3);border:.4cqw solid var(--c2);padding:.6cqw 1.4cqw;text-transform:none}
#pqName:focus-visible{outline:.4cqw solid var(--c3)}
#pqPass{font-family:var(--font-display);font-size:3.4cqw;width:100%;background:var(--c0);color:var(--c3);border:.4cqw solid var(--c2);padding:1cqw 1.4cqw;letter-spacing:.15em;text-transform:uppercase}
#pqPass:focus-visible{outline:.4cqw solid var(--c3)}
#pqPass::placeholder{color:var(--c1)}
#center .pw{font-family:var(--font-display);font-size:3.6cqw;color:var(--c3);text-align:center;border:.4cqw solid var(--c2);padding:1.6cqw 1cqw;letter-spacing:.12em;user-select:all;-webkit-user-select:all;white-space:nowrap}
#center.clear #cbody{flex:none;overflow:visible;align-items:center}
#center.clear{background:transparent;border-color:transparent;outline:none;justify-content:safe center;gap:1.4cqw;align-items:center;text-align:center;inset:3cqw}
#center h2{font-family:var(--font-display);font-size:3.2cqw;color:var(--c2);margin:0;line-height:1.4}
#center p{margin:0}
#center .legend{color:var(--c2)}
#center .epi{opacity:.8;font-style:italic}
#center .facts{display:grid;grid-template-columns:auto 1fr;gap:.2cqw 3cqw;margin:0}
#center .facts dt{opacity:.75}
#center .facts dd{margin:0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:1.2cqw}
.chip{border:.4cqw solid var(--c2);color:var(--c2);padding:.2cqw 1.4cqw;font-size:3.6cqw}
.logo{font-family:var(--font-display);font-size:5.8cqw;line-height:1.25;color:var(--c3);margin:0;letter-spacing:.04em;text-shadow:.8cqw .8cqw 0 var(--c1)}
.logo b{color:var(--c2);font-weight:400}
.tag{font-size:4.2cqw}
.status{font-family:var(--font-display);font-size:1.9cqw;opacity:.85;line-height:1.6}
.nonce{font-family:var(--font-display);font-size:2cqw;color:var(--c2);word-break:break-all}
#hIn{font:inherit;font-size:5cqw;width:100%;background:var(--c0);color:var(--c3);border:.4cqw solid var(--c2);padding:.6cqw 1.4cqw}
#hIn:focus-visible{outline:.4cqw solid var(--c3)}
/* Menu */
.menu{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:.4cqw 2cqw}
.menu button{all:unset;cursor:pointer;display:block;width:100%;font-family:var(--font-body);font-size:4.4cqw;line-height:1.1;padding:.3cqw 0 .3cqw 3.6cqw;position:relative;color:var(--c3)}
.menu button small{display:block;font-size:3.3cqw;opacity:.7}
.menu button.sel::before{content:"▶";position:absolute;left:0;top:.3cqw;color:var(--c2);animation:blink 1s steps(2,start) infinite}
.menu button[aria-disabled="true"]{opacity:.38;cursor:not-allowed}
.menu button:focus-visible{outline:.3cqw dashed var(--c2)}
#center.clear .menu{width:min(74cqw,100%);text-align:left;margin-top:.6cqw;gap:0 2cqw}
#center.clear .menu button{font-size:4cqw}
#center.clear .menu button small{font-size:2.9cqw}
#toast{top:2.2cqw;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:2.1cqw;line-height:1.7;color:var(--c0);background:var(--c2);border-color:var(--c3);text-align:center;width:max-content;max-width:90cqw;z-index:5}
/* Controlli */
.pad{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
.pad button{font-family:var(--font-display);font-size:12px;color:var(--c3);background:var(--c1);border:2px solid var(--c3);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--c2);color:var(--c0)}
.pad button:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.dpad [data-a=up]{grid-area:1/2}.dpad [data-a=left]{grid-area:2/1}.dpad [data-a=right]{grid-area:2/3}.dpad [data-a=down]{grid-area:3/2}
.ab{display:flex;gap:12px}
.ab button{width:58px;height:58px;border-radius:50%;font-size:14px}
.ab{display:grid;grid-template-columns:58px 58px;gap:8px 12px;justify-items:center}
.pad .mbtn{width:auto;height:26px;border-radius:4px;padding:0 10px;font-size:8px}
.ab .mbtn{grid-column:1/3}
.mid{flex:1 1 0;min-width:90px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;align-self:stretch}
@media (max-width:600px){.mid{order:3;flex:1 1 100%;align-self:auto}}
.mid .keys{flex:none}
.keys{margin:0;font-size:18px;opacity:.75;flex:1 1 160px;text-align:center}
@media (pointer:coarse){.keys{display:none}}
/* Etichetta del blocco */
.side{display:grid;gap:14px;min-width:0}
.card{border:2px solid var(--line);padding:14px 16px;display:grid;gap:10px;min-width:0;background:color-mix(in srgb,var(--c0) 82%,#000)}
.card h3{font-family:var(--font-display);font-size:9px;letter-spacing:.12em;color:var(--c2);margin:0;line-height:1.6}
.height{font-family:var(--font-display);font-size:20px;margin:0;font-variant-numeric:tabular-nums}
.legendTxt{margin:0;color:var(--c2)}
.hash{font-family:var(--font-display);font-size:8.5px;line-height:1.8;word-break:break-all;margin:0;opacity:.95}
.hash .z{color:var(--c2)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin:0;font-variant-numeric:tabular-nums}
.kv dt,.kv dd{padding:5px 0;border-bottom:1px dashed var(--c1)}
.kv dd{padding-left:14px;white-space:nowrap}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.kv dt{opacity:.7}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.map{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.map li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px;padding-bottom:6px;border-bottom:1px dashed var(--c1)}
.map li:last-child{border-bottom:0;padding-bottom:0}
.map li span{opacity:.7;min-width:0}
.map li b{font-weight:400;color:var(--c3);margin-left:auto;text-align:right;min-width:0}
.map li b::before{content:"→ ";color:var(--c2)}
.verify{color:var(--c2);font-family:var(--font-display);font-size:9px;line-height:1.8;text-decoration:none;border-bottom:2px solid var(--c1);justify-self:start}
.verify:hover,.verify:focus-visible{border-color:var(--c2)}
.note{margin:0;font-size:18px;opacity:.8}
/* Schermi stretti (telefono): testo più grande, il corpo delle finestre scorre */
@container (max-width: 420px){
  .win{font-size:5.4cqw}
  #hud{font-size:2.8cqw}
  .menu button{font-size:5.2cqw}
  .menu button small{display:none}
  #center.clear .menu button{font-size:4.8cqw}
  #center h2{font-size:3.8cqw}
  .status,.nonce{font-size:2.6cqw}
  #toast,#ebar{font-size:2.8cqw}
  #hbar{font-size:4.6cqw;top:calc(var(--ay,0px) + 35cqw);width:50cqw}
  #hbar .nm{font-size:2.8cqw}
  #ebar .intent{font-size:4.6cqw}
  #log{font-size:4.4cqw}
  #center .epi{display:none}
  .top5 ol{font-size:4.2cqw}
  .top5 li:nth-child(n+4):not(.me){display:none} /* sul telefono bastano i primi 3 (più la propria riga) */
  .top5 h4{font-size:2.4cqw}
  .board{font-size:4.4cqw}
}
/* STORY: testi della presentazione animata */
#story{position:absolute;left:5cqw;right:5cqw;text-align:center;font-family:var(--font-display);font-size:2.5cqw;line-height:1.75;color:var(--c3);white-space:pre-line;pointer-events:none;text-shadow:.3cqw 0 0 var(--c0),-.3cqw 0 0 var(--c0),0 .3cqw 0 var(--c0),0 -.3cqw 0 var(--c0)}
#story.big{transform:translateY(-50%)}
#story .logo{font-size:7cqw;line-height:1.2;margin:0;color:var(--c3)}
#story .logo b{color:var(--c2);font-weight:normal}
#story .press{margin:5cqw 0 0;font-size:2.4cqw;animation:blink 1s steps(2,start) infinite}
@container (max-width: 420px){#story{font-size:3.1cqw}}
.board .rk{font-size:.75em;opacity:.85;white-space:nowrap}
/* Computer: niente pulsanti a schermo, solo la riga dei tasti. Lo schermo di gioco è grande quanto la finestra (4:3), i riquadri del blocco vanno sotto, affiancati */
body:not(.touch) .wrap{max-width:none;padding-inline:24px}
body:not(.touch) .main{grid-template-columns:minmax(0,1fr)}
body:not(.touch) .cab{width:min(100%,calc((100vh - 150px) * 4 / 3));justify-self:center}
body:not(.touch) .side .card{align-content:start;height:100%}
body:not(.touch) .top{width:min(100%,calc((100vh - 150px) * 4 / 3));justify-self:center;margin-inline:auto}
body:not(.touch) .side{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));grid-auto-rows:1fr;align-items:stretch;width:min(100%,max(calc((100vh - 150px) * 4 / 3),880px));justify-self:center}
body:not(.touch) .dpad,body:not(.touch) .ab,body:not(.touch) .mid .mbtn{display:none}
/* Telefono: gioco a tutto schermo, controlli trasparenti sopra la mappa, sfere in alto */
body.touch{overflow:hidden;overscroll-behavior:none}
body.touch .wrap{padding:0;max-width:none;display:block}
body.touch .top,body.touch .side{display:none}
body.touch .main{display:block}
body.touch .cab{position:fixed;inset:0;padding:0;border:0;display:block;touch-action:none}
body.touch .screen{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;outline:0}
body.touch #cv{height:auto}
@media (orientation:landscape){body.touch .screen{width:min(100vw,133.3vh);width:min(100vw,133.3dvh);height:auto;aspect-ratio:4/3;margin:0 auto}}
body.touch .pad{position:absolute;inset:0;pointer-events:none;display:block}
body.touch .pad button{pointer-events:auto;background:color-mix(in srgb,var(--c1) 38%,transparent);border-color:color-mix(in srgb,var(--c3) 55%,transparent);color:color-mix(in srgb,var(--c3) 85%,transparent)}
body.touch .pad button:active{background:var(--c2);color:var(--c0);border-color:var(--c3)}
body.touch .dpad{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
body.touch .ab{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));grid-template-columns:62px 62px;gap:10px 12px}
body.touch .ab button:not(.mbtn){width:62px;height:62px;font-size:13px}
body.touch .pad .mbtn{height:24px;font-size:7px;padding:0 8px}
body.touch .mid .mbtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px}
body.touch .keys{display:none}
body.touch:not(.playing) .pad .mbtn{display:none} /* HEAL e MENU solo mentre esplori */
body.touch #menu{left:2.2cqw;right:2.2cqw;width:auto}
@media (orientation:landscape){body.touch .mid .mbtn{top:10px;right:14px}}
body.touch #dlg,body.touch #menu{bottom:calc(var(--ctl,0px) + 8px)}
body.touch #log{left:2.2cqw;right:2.2cqw;bottom:calc(var(--ctl,0px) + 18cqw)}
body.touch #center{bottom:calc(var(--ctl,0px) + 8px)}

function rules(b, live = false) {

  const lootMod = 1 + fp * .08; // la fee mediana arricchisce il bottino, non rende più forti i nemici
  const gap = b.prevTs == null ? null : Math.max(0, b.ts - b.prevTs);
  const g = gap == null ? 600 : gap;
  const vision = g < 180 ? 7 : g < 600 ? 6 : g < 1200 ? 5 : g < 2400 ? 4 : 3;
  const zeros = b.hash.match(/^0*/)[0].length;
  const wr = clamp(b.weight / 4e6, 0, 1);
  // Epoca di difficoltà: quanto il tempo medio dei blocchi si è allontanato dai 10 minuti.
  const ep = b.epoch || null, nEp = ep ? b.height - ep.start : 0;
  const minDiff = (b.difficulty || 1) <= 1; // difficoltà minima del protocollo: non può scendere, nessuna pressione
  const epAvg = ep && nEp > 0 ? (b.ts - ep.startTs) / nEp : null;
  const rawRatio = minDiff || epAvg == null ? 1 : epAvg / 600;
  const hashRatio = 1 + (rawRatio - 1) * nEp / (nEp + 18); // prudenza nei primi blocchi dell'epoca
  const hashMod = clamp(Math.pow(hashRatio, HASH_EXP), HASH_MIN, HASH_MAX);
  return {
    ep, nEp, epAvg, hashMod, hostile: hashMod >= HOSTILE,
    retargetEst: epAvg == null || minDiff ? null : clamp(1 / rawRatio - 1, -.75, 3),
    lastRetarget: ep && ep.prevDiff && nEp < 2016 && ep.start > 0 ? ep.diff / ep.prevDiff - 1 : null,
    nextRetarget: ep ? ep.start + 2016 : b.height - b.height % 2016 + 2016,
    era, eraInfo: ERAS[Math.min(era, ERAS.length - 1)], fp, lootMod, gap, vision, zeros,
    goldF: Math.log10((b.fees || 0) + 10),
    diffMod: 1 + Math.log10((b.difficulty || 1) + 1) / 60,
    W: 24 + Math.round(wr * 20), H: 18 + Math.round(wr * 12),
    nRooms: clamp(3 + Math.floor(Math.log2(b.tx + 1)), 3, 14),
    nEnemies: b.tx <= 1 ? (b.height === 0 ? 1 : 0) : clamp(Math.round(Math.log2(b.tx) * 1.2), 1, 16),
    nChests: 1 + (b.nonce % 3),
    relic: .03 + zeros * .004,
    bossInfo: bossFor(b.pool, era, live),
    get boss() { return this.bossInfo.name; },
    solo: live && isSolo(b.pool),
    halving: b.height > 0 && b.height % 210000 === 0,
    retarget: b.height > 0 && b.height % 2016 === 0,
    empty: b.tx <= 1 && b.height > 0,
    genesis: b.height === 0,
    storm: (b.medianFee || 0) >= 50,
    calm: (b.medianFee || 0) <= 2,

}

    hp: Math.round((48 + depth * 11) * BASE_STR * R.diffMod * HM), atk: Math.round((7 + depth * 2.1) * BASE_STR * HMA), def: Math.round(3 + depth * 1.4),

      hp: Math.round((14 + depth * 6) * T.hp * BASE_STR * HM), atk: Math.round((6 + depth * 2.0) * T.atk * BASE_STR * HMA), def: Math.round((2 + depth * 1.3) * T.def),
      xp: Math.round((6 + depth * 4) * T.xp * BASE_STR * HMR), gold: Math.max(1, Math.round(R.goldF * (1.5 + rng() * 1.5) * (1 + depth * .15) * R.lootMod * HMR * (T.gold || 1)))};

}

/* ───────── Arena dei boss ─────────
   Solo il guardiano del blocco e il Minatore Solitario si combattono nell'arena, a turni, con la mossa annunciata un turno prima. */
async function startBattle(e) {
  state = 'battle'; battle = {e, shakeE: 0}; hero.shield = false; $('log').hidden = true;
  SFX.encounter(); renderHud(); renderEbar();
  if (e.legendary) { flashUntil = performance.now() + 600; SFX.legend(); }
  await say(e.legendary ? `The ${e.name.toUpperCase()} raises his pickaxe. ${e.epi}` : `${e.name} awakens! ${e.epi}`);
  battleMenu();
}
function battleMenu() {
  if (!battle) return;
  renderHud(); renderEbar();
  openMenu($('menu'), [
    {label: 'ATTACK', act: () => turn('atk')},
    {label: `BOLT · ${fmt(cost('bolt'))} SATS`, disabled: P.gold < cost('bolt'), act: () => turn('zap')},
    {label: `HEAL · ${fmt(cost('heal'))} SATS`, disabled: P.gold < cost('heal'), act: () => turn('heal')},
    {label: 'DEFEND', act: () => turn('def')},
  ], {cols: 2, hide: true});
}
const ENEMY_AT = {arena: true, px: 186, py: 22}, HERO_AT = {arena: true, px: 66, py: 92};
async function turn(kind) {
  const e = battle.e;
  battle.turn = (battle.turn || 0) + 1;
  battle.defending = false;
  let zapped = false;
  if (kind === 'atk' && battle.blind > 0 && (battle.blind--, Math.random() < .5)) {
    battle.anim = {who: 'hero', t0: performance.now()}; SFX.bump(); await say('The headlamp blinds you: you miss.');
  } else if (kind === 'atk') {
    let d = dmgCalc(P.atk, e.def); const crit = Math.random() < .08; if (crit) d = Math.round(d * 1.8);
    battle.anim = {who: 'hero', t0: performance.now()};
    e.hp -= d; battle.shakeE = performance.now() + 300; SFX.hit(); renderEbar(); floatText(d, ENEMY_AT, crit ? 2 : 3);
    await say(`${crit ? 'Critical hit! ' : ''}${hn()} strikes ${e.name}: ${d} damage.`);
  } else if (kind === 'zap') {
    const c = spend(cost('bolt'), 'bolt'); const d = Math.round(P.atk * 1.25 + 3 + Math.random() * 3); zapped = true; floatText('-' + c, HERO_AT, 2);
    e.hp -= d; battle.shakeE = performance.now() + 400; flashUntil = performance.now() + 120; SFX.zap(); renderEbar(); renderHud(); floatText(d, ENEMY_AT, 2);
    await say(`${hn()} casts a Lightning Network bolt on ${e.name}: ${d} damage.`);
  } else if (kind === 'heal') {
    const c = spend(cost('heal'), 'heal'); const h = Math.round(P.maxhp * .5); P.hp = Math.min(P.maxhp, P.hp + h); SFX.heal(); renderHud(); floatText('+' + h, HERO_AT, 3);
    await say(`${hn()} recovers ${h} HP.`);
  } else if (kind === 'def') {
    battle.defending = true; renderHud();
    await say('You raise your guard: much less damage this turn.');
  }
  if (e.hp <= 0) return victory();
  if (e.legendary && battle.rebootPending && zapped) {
    battle.rebootPending = false; battle.healed = true; battle.stunned = true;
    flashUntil = performance.now() + 300; renderEbar();
    await say('The bolt shorts out the Bitaxe! The reboot fails and the Lone Miner is stunned.');
  }
  await enemyAct(e);
  battle.defending = false;
  renderEbar();
  if (P.hp <= 0) return defeat();
  battleMenu();
}
async function enemyAct(e) {
  const guard = battle.defending;
  const hit = async (mult, text) => {
    const d = Math.max(1, Math.round(dmgCalc(e.atk, P.def) * mult));
    battle.anim = {who: 'enemy', t0: performance.now()};
    P.hp = Math.max(0, P.hp - d); shakeUntil = performance.now() + 260; heroHitUntil = performance.now() + 300; SFX.hurt(); renderHud(); floatText(d, HERO_AT, 2);
    await say(text.replace('{d}', d));
  };
  if (!e.legendary) {
    // guardiano normale: la mossa speciale viene annunciata un turno prima, e Difendi la attutisce
    if (battle.intent === 'special') {
      battle.intent = null; renderEbar();
      return guard ? hit(.55, `${e.name} unleashes ${e.move}, but you were on guard: {d} damage.`) : hit(1.6, `${e.name} unleashes ${e.move}: {d} damage!`);
    }
    await hit(guard ? .5 : 1, `${e.name} hits you: {d} damage.`);
    if (P.hp > 0 && Math.random() < .22) { battle.intent = 'special'; renderEbar(); await say(`${e.name} is charging ${e.move}! DEFEND to soften the blow.`); }
    return;
  }
  // Minatore Solitario: ogni mossa pericolosa è annunciata un turno prima. Chi legge i segnali vince, chi attacca e basta no.
  if (battle.stunned) { battle.stunned = false; return say('The Lone Miner tries to restart his Bitaxe and loses the turn.'); }
  if (battle.rebootPending) {
    battle.rebootPending = false; battle.healed = true;
    const h = Math.round(e.maxhp * .4); e.hp = Math.min(e.maxhp, e.hp + h); renderEbar(); SFX.heal(); floatText('+' + h, ENEMY_AT, 3);
    return say(`The Bitaxe reboots: the fans spin again and the Lone Miner recovers ${h} HP.`);
  }
  if (battle.charging) {
    battle.charging = false; flashUntil = performance.now() + 250; renderEbar();
    return guard
      ? hit(.75, 'LUCKY NONCE! You were on guard: only {d} damage.')
      : hit(3.2, 'LUCKY NONCE! One chance in four billion, and he found it: {d} damage!');
  }
  if (!battle.healed && e.hp < e.maxhp * .5) {
    battle.rebootPending = true; renderEbar();
    return say('The fans of his Bitaxe slow down: he is about to reboot it. The heatsink stays exposed for one turn.');
  }
  if (!battle.blinded) {
    battle.blinded = true; battle.blind = 2;
    return hit(guard ? .3 : .6, 'The Lone Miner switches on his HEADLAMP: {d} damage, and the light blinds you!');
  }
  if (battle.turn >= 3 && (battle.turn - (battle.lastCharge || 0) >= 4 || Math.random() < .25)) {
    battle.charging = true; battle.lastCharge = battle.turn; renderEbar();
    return say('The Lone Miner stares at his miner screen: he is grinding a nonce and the hash is closing in on the target...');
  }
  await hit(guard ? .5 : 1, 'The Lone Miner hits you with his pickaxe: {d} damage.');
  if (e.hp < e.maxhp * .3 && P.hp > 0) {
    if (!battle.enraged) { battle.enraged = true; await say('He pushes his hashrate to the max: from now on he strikes twice per turn!'); }
    await hit(guard ? .35 : .7, 'He strikes again: {d} damage!');
  }
}
async function victory() {
  const e = battle.e; e.dead = true; renderEbar(); SFX.win();
  P.xp += e.xp; P.gold += e.gold; floatText('+' + e.gold, ENEMY_AT, 2);
  await say(`${e.name} is defeated! +${e.xp} XP, +${fmt(e.gold)} sats.`);
  for (const m of levelUps()) await say(m);
  if (e.legendary) {
    P.atk += 5; P.def += 5; P.maxhp += 20; P.hp = P.maxhp; SFX.legend(); renderHud();
    await say("You obtain the LONE MINER'S NUGGET: ATK +5, DEF +5, max HP +20.");
    run.legends = (run.legends || 0) + 1;
    const n = addAlbo(floor.b);
    await say(`Block #${fmt(floor.b.height)} enters your Hall of Legends (${n} ${n === 1 ? 'legend' : 'legends'}).`);
  }
  if (run.mode === 'legend' && floor.b.outro) await say(floor.b.outro);
  const next = run.mode === 'legend' ? (HISTORY[run.li + 1] ? '#' + fmt(HISTORY[run.li + 1].height) : HEND.last) : '#' + fmt(floor.b.height + 1);
  await say(`The stairs unlock. They lead to ${next}.`);

}
function endBattle() {
  battle = null; state = 'explore'; closeMenu(); $('menu').hidden = true;
  renderEbar(); computeVis(); renderHud(); save();
}
async function defeat() {
  state = 'dead'; closeMenu(); $('menu').hidden = true; $('log').hidden = true; SFX.die();
  await say(`${hn()} has fallen. REORG! The branch is orphaned and you go back to the start of the block, with half your sats.`);

/* ───────── STORY: presentazione animata stile anni '90 (come l'intro di Castlevania per NES) ─────────
   Si apre solo dal menu del titolo (voce INTRO, solo se content.js porta i testi in CONTENT.intro). Circa 50 secondi, A / B / MENU la saltano.
   Le scene si disegnano nel canvas su una "scena" di 256×192 (centrata sul telefono), i testi in #story. */
const STORY = CONTENT.intro || [];
let story = null, storyMusic = 0;
const STORY_ENEMIES = ['slime', 'bat', 'ghost', 'skel', 'goblin', 'rat'];
const STORY_POOLS = ['golem', 'ant', 'hydra', 'spider'];
const GY = 138; // suolo delle scene: sotto c'è la fascia scura dei testi, come nelle intro NES
function playStory() {
  closeMenu(); hideCenter(); state = 'story'; floor = null; battle = null; renderHud();
  setPalette(4);
  story = {t0: performance.now(), i: -1};
  $('story').hidden = false;
  startStoryMusic();
}
function endStory() {
  if (!story) return;
  story = null; clearInterval(storyMusic); storyMusic = 0;
  const el = $('story'); el.hidden = true; el.innerHTML = '';
  showTitle();
}
// Musica: arpeggio in La minore, basso a ogni battuta (loop di 32 passi da 150 ms)
function startStoryMusic() {
  clearInterval(storyMusic);
  const A = [220, 0, 262, 330, 440, 330, 262, 330, 196, 0, 247, 294, 392, 294, 247, 294, 175, 0, 220, 262, 349, 262, 220, 262, 165, 0, 208, 247, 330, 247, 330, 415];
  const BASS = [110, 98, 87, 82];
  let step = 0;
  storyMusic = setInterval(() => {
    if (!story) return;
    const f = A[step % 32]; if (f) beep(f, .13, 'square', .028);
    if (step % 8 === 0) beep(BASS[(step >> 3) % 4], .5, 'triangle', .06);
    step++;
  }, 150);
}
function storyScene(now) {
  let lt = now - story.t0, i = 0;
  while (i < STORY.length && lt >= STORY[i].d) { lt -= STORY[i].d; i++; }
  return i >= STORY.length ? null : {i, lt, s: STORY[i]};
}
function drawStory(t) {
  const now = performance.now(), sc = storyScene(now);
  if (!sc) { endStory(); return; }
  const oy = Math.max(0, Math.round((H() - CTL - 192) / 2)), k = $('screen').clientWidth / 256;
  if (sc.i !== story.i) { // nuova scena: posiziona il testo
    story.i = sc.i; const el = $('story');
    el.className = sc.s.scene === 'title' ? 'big' : '';
    el.style.top = (oy + sc.s.y) * k + 'px';
    el.innerHTML = sc.s.scene === 'title' ? '<p class="logo">PROOF OF<br><b>QUEST</b></p><p class="press">PRESS A</p>' : '';
  }
  if (sc.s.text) { // testo che si scrive da solo
    const n = reduced ? sc.s.text.length : Math.min(sc.s.text.length, Math.floor(Math.max(0, sc.lt - 500) / 38));
    const el = $('story'); if (el.dataset.n !== String(n) || el.dataset.i !== String(sc.i)) { el.textContent = sc.s.text.slice(0, n); el.dataset.n = n; el.dataset.i = sc.i; }
  }
  ctx.translate(0, oy);
  const lt = sc.lt, sky = (moon = true) => { // cielo stellato e luna
    for (let j = 0; j < 70; j++) { const h = Math.imul(j + 7, 2654435761) >>> 0, x = h % 256, y = (h >> 9) % (GY - 8); ctx.fillStyle = (j + Math.floor(t / 400)) % 9 === 0 ? pal[3] : pal[1]; ctx.fillRect(x, y, 1, 1); }
    if (moon) for (let y = -16; y <= 16; y++) for (let x = -16; x <= 16; x++) if (x * x + y * y <= 260) { ctx.fillStyle = (x + 4) * (x + 4) + (y + 3) * (y + 3) < 30 || (x - 6) * (x - 6) + (y - 5) * (y - 5) < 12 ? pal[2] : pal[3]; ctx.fillRect(206 + x, 36 + y, 1, 1); }
  };
  const ground = () => { ctx.fillStyle = pal[1]; ctx.fillRect(0, GY, 256, 4); ctx.fillStyle = pal[2]; ctx.fillRect(0, GY, 256, 1); };
  // torre di blocchi: n blocchi alti 13 px che salgono dal suolo
  const tower = (x, n, door) => {
    for (let b = 0; b < n; b++) {
      const y = GY - (b + 1) * 13;
      ctx.fillStyle = pal[0]; ctx.fillRect(x - 1, y - 1, 46, 14);
      ctx.fillStyle = pal[1]; ctx.fillRect(x, y, 44, 12);
      ctx.fillStyle = pal[2]; ctx.fillRect(x, y, 44, 1); ctx.fillRect(x + 4, y + 4, 14 + (b * 7) % 18, 1); ctx.fillRect(x + 4, y + 7, 8 + (b * 11) % 22, 1);
    }
    if (n) { ctx.fillStyle = pal[1]; for (let m = 0; m < 4; m++) ctx.fillRect(x + m * 12, GY - n * 13 - 5, 8, 5); } // merli
    if (door) { ctx.fillStyle = pal[0]; ctx.fillRect(x + 15, GY - 18, 14, 18); ctx.fillRect(x + 17, GY - 21, 10, 3); }
  };
  const bat = (x, y, f) => ctx.drawImage(spr(f ? 'bat_b' : 'bat'), Math.round(x), Math.round(y));
  switch (sc.s.scene) {
    case 'genesis': { // il blocco Genesis che si accende nel buio
      const a = Math.min(1, lt / 2500);
      ctx.globalAlpha = a; ctx.save(); ctx.translate(0, 34); tower(106, 1, false); ctx.restore(); ctx.globalAlpha = 1;
      if (Math.floor(t / 500) % 2) { ctx.fillStyle = pal[3]; ctx.fillRect(127, GY + 14, 2, 2); }
      break;
    }
    case 'tower': { sky(); ground(); const n = Math.min(10, 1 + Math.floor(lt / 500)); tower(150, n, true);
      if (n < 10) { const f = (lt % 500) / 500; ctx.globalAlpha = .6; ctx.fillStyle = pal[2]; ctx.fillRect(150, GY - (n + 1) * 13 - Math.round((1 - f) * 40), 44, 12); ctx.globalAlpha = 1; }
      break; }
    case 'hero': { sky(); ground(); tower(170, 10, true);
      const x = Math.min(150, -32 + lt / 30), step = Math.floor(t / 180) % 2;
      ctx.drawImage(spr('heroSide'), Math.round(x), GY - 32 - step, 32, 32);
      for (let j = 0; j < 3; j++) bat((lt / 18 + j * 90) % 300 - 30, 40 + j * 22 + Math.sin(t / 250 + j) * 6, Math.floor(t / 150 + j) % 2);
      break; }
    case 'bugs': { ground(); ctx.fillStyle = pal[1]; for (let j = 0; j < 30; j++) ctx.fillRect((j * 37) % 256, 20 + (j * 53) % 90, 2, 1);
      STORY_ENEMIES.forEach((k2, j) => { const tj = lt - j * 900; if (tj < 0) return;
        const x = 12 + j * 40, y = 64 + Math.round(Math.max(0, 1 - tj / 300) * -60);
        ctx.drawImage(spr(anim(k2, t)), x, y, 32, 32); });
      break; }
    case 'pools': { sky(false); ground(); tower(106, 10, false);
      const flash = Math.floor(lt / 1600) !== Math.floor((lt - 16) / 1600) || (lt % 1600) < 120;
      STORY_POOLS.forEach((g, j) => { ctx.globalAlpha = flash ? 1 : .35; ctx.drawImage(spr(anim('g_' + g, t)), [22, 62, 162, 202][j], 6 + (j % 2) * 14, 32, 32); ctx.globalAlpha = 1; });
      if (flash) { ctx.fillStyle = pal[3]; ctx.globalAlpha = .25; ctx.fillRect(0, 0, 256, 192); ctx.globalAlpha = 1; }
      break; }
    case 'climb': { sky(); ground(); tower(106, 11, true);
      const yy = GY - 16 - Math.min(110, lt / 60);
      ctx.drawImage(spr('heroUp'), 152, Math.round(yy));
      break; }
    case 'title': { sky(); ground(); tower(170, 10, true); ctx.drawImage(spr('heroUp'), 34, GY - 16); break; }
  }
  // dissolvenza in apertura e chiusura di ogni scena
  const fade = Math.max(0, 1 - sc.lt / 400, 1 - (sc.s.d - sc.lt) / 400);
  if (fade > 0) { ctx.globalAlpha = Math.min(1, fade); ctx.fillStyle = pal[0]; ctx.fillRect(0, -oy, 256, H()); ctx.globalAlpha = 1; }
}

/* ───────── Input ───────── */
// I browser accendono l'audio solo dopo un gesto del giocatore: si riprova a ogni gesto.
function unlockAudio() {
  if (!soundOn) return;
  try {
    const fresh = !AC; audioCtx();
    if (AC.state === 'closed') { AC = null; MASTER = null; audioCtx(); }
    if (AC.state !== 'running') AC.resume().catch(() => { AC = null; MASTER = null; }); // se il sistema non lo ridà, al prossimo tocco se ne crea uno nuovo
    if (fresh) beep(30, .02, 'square', .0001); // un suono muto dentro il gesto sblocca l'audio anche su iPhone
  } catch (e) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, {capture: true, passive: true}));
// Sul telefono, quando la finestra va in background, il sistema "interrompe" l'audio del web e spesso non lo ridà più.
// Quindi: si mette in pausa il gioco, si chiude l'audio e al primo tocco dopo il ritorno se ne crea uno nuovo.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  hero.shield = false;
  if (state === 'explore' && !dlg && !menu) openPause();
  if (AC) { const old = AC; AC = null; MASTER = null; try { old.close().catch(() => {}); } catch (e) {} }
});
window.addEventListener('pagehide', () => { if (AC) { const old = AC; AC = null; MASTER = null; try { old.close().catch(() => {}); } catch (e) {} } });
const KEYS = {ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',

/* ───────── Computer o telefono ─────────
   Telefono (puntatore "grossolano" o primo tocco sullo schermo): gioco a tutto schermo, controlli trasparenti sopra la mappa,
   sfere in alto. In verticale si vedono più righe di mappa. Computer: niente pulsanti a schermo, si gioca con la tastiera. */
function layout() {
  TOUCH = document.body.classList.contains('touch');

  if (TOUCH && innerHeight > innerWidth * 1.05) {
    vh = clamp(Math.floor(256 * innerHeight / innerWidth / TS), 12, 40);
    const d = document.querySelector('.dpad').getBoundingClientRect();

  CTL = Math.max(0, Math.round((ctlPx - (TOUCH && ctlPx ? gap : 0)) / k));

}
